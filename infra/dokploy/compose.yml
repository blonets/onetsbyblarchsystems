# Dokploy compose for the MikroTik fleet platform.
#
# Everything is env-driven — NO secrets are committed here. Set the values in
# the Dokploy environment UI (or a .env file that is never committed).
# Full reference: infra/dokploy/.env.example
#   POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB, DATABASE_URL,
#   REDIS_URL, JWT_SECRET, JWT_EXPIRES_IN, API_PORT, CORS_ORIGINS, PANEL_PUBLIC_HOST,
#   PUBLIC_API_URL, PUBLIC_WEB_URL, INTERNAL_API_KEY, API_BASE_URL,
#   SSTP_HUB_HOST, SSTP_HUB_API_PORT, SSTP_HUB_API_USER, SSTP_HUB_API_PASSWORD,
#   TUNNEL_SUPERNET, TUNNEL_HUB_IP,
#   NEXT_PUBLIC_API_URL, WORKER_SHARD_INDEX, WORKER_SHARD_COUNT, POLL_INTERVAL_MS,
#   SMTP_HOST, SMTP_PORT, SMTP_SECURE, SMTP_USER, SMTP_PASS, SMTP_FROM,
#   DOMAIN_WEB, DOMAIN_API
#
# SSTP_HUB_HOST: canonical hub DNS name for SSTP dialing (DNS-based dialing
# proven live 2026-10-16). Never hardcode a hub IP in code or config.
#
# TimescaleDB: the image ships the extension preinstalled; migration
# 0002_timescale runs `CREATE EXTENSION IF NOT EXISTS timescaledb` automatically
# via the API entrypoint (`prisma migrate deploy` on container start).

name: mtk-fleet

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      API_PORT: ${API_PORT:-3001}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-3600}
      # Shared worker↔API internal key (x-internal-key). The API fails
      # closed on /internal/* routes when this is unset.
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      # AES-256-GCM master key for the persistent vault (vault_entries).
      # Without it the API falls back to the dev/test in-memory vault and
      # every router password is lost on restart — REQUIRED in production.
      VAULT_MASTER_KEY: ${VAULT_MASTER_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      PANEL_PUBLIC_HOST: ${PANEL_PUBLIC_HOST:-api.onetsbyblarch.online}
      # One-shot migration recovery ONLY (see api-entrypoint.sh): set to a
      # failed migration's name for a single deploy, then REMOVE it.
      PRISMA_RESOLVE_ROLLED_BACK: ${PRISMA_RESOLVE_ROLLED_BACK:-}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-}
      SSTP_HUB_HOST: ${SSTP_HUB_HOST}
      SSTP_HUB_API_PORT: ${SSTP_HUB_API_PORT:-8728}
      SSTP_HUB_API_USER: ${SSTP_HUB_API_USER}
      SSTP_HUB_API_PASSWORD: ${SSTP_HUB_API_PASSWORD}
      TUNNEL_SUPERNET: ${TUNNEL_SUPERNET:-10.200.0.0/16}
      TUNNEL_HUB_IP: ${TUNNEL_HUB_IP:-10.200.0.1}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    ports:
      - '${API_PORT:-3001}:${API_PORT:-3001}'
    networks:
      - default
      - dokploy-network
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:${API_PORT:-3001}/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      # Internal API base URL inside the compose network — the worker
      # resolves routers/secrets/audit through it (never localhost).
      API_BASE_URL: http://api:${API_PORT:-3001}
      # Same shared internal key as the api service (x-internal-key).
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      SSTP_HUB_HOST: ${SSTP_HUB_HOST}
      SSTP_HUB_API_PORT: ${SSTP_HUB_API_PORT:-8728}
      WORKER_SHARD_INDEX: ${WORKER_SHARD_INDEX:-0}
      WORKER_SHARD_COUNT: ${WORKER_SHARD_COUNT:-1}
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-60000}
    deploy:
      # scale workers out and give each replica its own WORKER_SHARD_INDEX
      replicas: 1

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-}
      PORT: 3000
    ports:
      # Host port 3002: 3000 is already allocated on the Dokploy host by
      # another app. Dokploy/Traefik routes the domain to container port 3000
      # over the compose network, so the host binding is only for debugging.
      - '3002:3000'
    networks:
      - default
      - dokploy-network
    healthcheck:
      # node:24-slim has no curl/wget; use node's built-in fetch.
      test: ['CMD-SHELL', 'node -e "fetch(`http://localhost:3000/`).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  pgdata:
  redisdata:

networks:
  # Traefik (Dokploy's reverse proxy) lives on this external network — any
  # service with a domain attached MUST join it or the domain returns 404.
  dokploy-network:
    external: true
