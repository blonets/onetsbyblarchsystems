# Development compose for the MikroTik fleet platform.
#
# Usage:  docker compose -f infra/docker/compose.dev.yml --env-file .env up --build
# Copy infra/dokploy/.env.example to .env first (never commit .env).
#
# Differences from the production compose (infra/dokploy/compose.yml):
#   - Services run from source with hot reload (tsx / next dev) instead of
#     prebuilt production images.
#   - The workspace is bind-mounted so code changes apply instantly.
#   - Ports are published for local access; no Dokploy domains needed.
#   - node_modules are kept in named volumes so host and container deps
#     don't clash.
#
# Everything remains env-driven — see infra/dokploy/.env.example.

name: mtk-fleet-dev

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mtk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mtk_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-mtk_fleet}
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-mtk} -d ${POSTGRES_DB:-mtk_fleet}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata-dev:/data
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: node:24-slim
    working_dir: /app
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm --filter @mtk/api exec prisma generate && pnpm --filter @mtk/api exec prisma migrate deploy && pnpm --filter @mtk/api dev"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL:-postgresql://mtk:mtk_dev_password@postgres:5432/mtk_fleet}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      API_PORT: ${API_PORT:-3001}
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-3600}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3001}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
      SSTP_HUB_HOST: ${SSTP_HUB_HOST:-}
      SSTP_HUB_API_PORT: ${SSTP_HUB_API_PORT:-8728}
      SSTP_HUB_API_USER: ${SSTP_HUB_API_USER:-}
      SSTP_HUB_API_PASSWORD: ${SSTP_HUB_API_PASSWORD:-}
      TUNNEL_SUPERNET: ${TUNNEL_SUPERNET:-10.200.0.0/16}
      TUNNEL_HUB_IP: ${TUNNEL_HUB_IP:-10.200.0.1}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - ../..:/app
      - node_modules_api:/app/node_modules
      - api_dist:/app/apps/api/dist
    ports:
      - '${API_PORT:-3001}:${API_PORT:-3001}'

  worker:
    image: node:24-slim
    working_dir: /app
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm --filter @mtk/worker dev"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL:-postgresql://mtk:mtk_dev_password@postgres:5432/mtk_fleet}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      SSTP_HUB_HOST: ${SSTP_HUB_HOST:-}
      SSTP_HUB_API_PORT: ${SSTP_HUB_API_PORT:-8728}
      SSTP_HUB_API_USER: ${SSTP_HUB_API_USER:-}
      SSTP_HUB_API_PASSWORD: ${SSTP_HUB_API_PASSWORD:-}
      WORKER_SHARD_INDEX: ${WORKER_SHARD_INDEX:-0}
      WORKER_SHARD_COUNT: ${WORKER_SHARD_COUNT:-1}
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-60000}
    volumes:
      - ../..:/app
      - node_modules_worker:/app/node_modules
      - worker_dist:/app/apps/worker/dist

  web:
    image: node:24-slim
    working_dir: /app
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm --filter @mtk/web dev -- --port 3000 --hostname 0.0.0.0"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
      PORT: 3000
    volumes:
      - ../..:/app
      - node_modules_web:/app/node_modules
      - web_next:/app/apps/web/.next
    ports:
      - '3000:3000'

volumes:
  pgdata-dev:
  redisdata-dev:
  node_modules_api:
  node_modules_worker:
  node_modules_web:
  api_dist:
  worker_dist:
  web_next:
